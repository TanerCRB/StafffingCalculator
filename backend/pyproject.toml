[project]
name = "stafffingcalculator-backend"
version = "0.1.0"
description = "IT project staffing/profitability planner — backend API"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "reportlab>=4.2",
    "XlsxWriter>=3.2",
    "httpx>=0.28.1",
]

[tool.setuptools.packages.find]
include = ["app*"]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "ruff>=0.7",
    # Isolation/constraint behaviour is proven against a real PostgreSQL, never a stand-in
    # (ADR-0001, "Konsekwencje").
    "testcontainers[postgres]>=4.8",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
